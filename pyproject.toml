[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splitrecord"
version = "0.1.0"
description = "Z-score residual, Theil-Sen slope, and Mann-Kendall for two aligned records."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Digital Currensy Inc."}]

[tool.setuptools.packages.find]
where = ["src"]
