name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "17 15 * * *"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse a private key or a token
        run: bash .githooks/pre-commit --ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e .
      - name: Kernel tests
        run: python -m unittest tests.test_kernel
      - name: Example
        run: python -m splitrecord examples/left.csv examples/right.csv
      - name: Seasonal example
        run: python -m splitrecord examples/left.csv examples/right.csv --seasons 2 --covariance
      - name: Prewhiten example
        run: python -m splitrecord examples/pw_left.csv examples/pw_right.csv --prewhiten

